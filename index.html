<!DOCTYPE html>

<style>
  *{ margin:0; padding:0; box-sizing:border-box; }
  ::selection{
    background:#FFFFFF;
    color:#A9C7C5;
  }
  ::-moz-selection{
    background:#FFFFFF;
    color:#A9C7C5;
  }
  html{
    width:100%;
    height:100%;
    min-height:100%;
    background:#A9C7C5;
    border-radius:0;
    overflow:hidden;
  }
  body{
    width:100%;
    min-height:100%;
    min-height:100vh;
    min-height:100svh;
    min-height:100dvh;
    background:#A9C7C5;
    border-radius:0;
    display:grid;
    place-items:center;
    overflow:hidden;
    overscroll-behavior:none;
    -webkit-tap-highlight-color:transparent;
  }
  .brand{
    display:flex;
    flex-direction:column;
    align-items:center;
    transform:translateY(-9px);
  }
  .logo{
    width:clamp(46px, 8vmin, 70px);
    height:auto;
    display:block;
    overflow:visible;
    margin-bottom:clamp(2px, .45vmin, 4px);
  }
  .leaf{
    transform-box:view-box;
    transform-origin:50% 50%;
    will-change:transform;
  }
  .brand-name{
    color:#FFFFFF;
    font-family:'Chillax', sans-serif;
    font-size:clamp(42px, 7.5vmin, 72px);
    font-weight:500;
    line-height:1;
    letter-spacing:-0.02em;
    font-synthesis:none;
    transform:translateY(-3px);
  }
  .optical-e{
    display:inline-block;
    position:relative;
    color:transparent;
  }
  .optical-e-visual{
    position:absolute;
    inset:0;
    color:#FFFFFF;
    pointer-events:none;
    transform:scale(1.03);
    transform-origin:50% 58%;
    user-select:none;
  }
  .optical-e.is-selected,
  .optical-e.is-selected .optical-e-visual{
    color:#A9C7C5;
  }
  @media (prefers-reduced-motion:reduce){
    .leaf{ will-change:auto; }
  }
</style>
</head>
<body>
  <main class="brand" aria-label="euca">
    <svg class="logo" viewBox="24 24 52 52" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <g fill="#FFFFFF">
        <g class="leaf leaf--left">
          <ellipse cx="42.93" cy="42.93" rx="10" ry="16.18" transform="rotate(-22.5 42.93 42.93)"/>
        </g>
        <g class="leaf leaf--right">
          <ellipse cx="57.07" cy="57.07" rx="10" ry="16.18" transform="rotate(22.5 57.07 57.07)"/>
        </g>
      </g>
    </svg>
    <h1 class="brand-name"><span class="optical-e">e<span class="optical-e-visual" aria-hidden="true">e</span></span>uca</h1>
  </main>
  <script>
    (() => {
      const opticalE = document.querySelector('.optical-e');
      const syncOpticalSelection = () => {
        const selection = window.getSelection();
        const selected = selection && selection.rangeCount && !selection.isCollapsed
          ? selection.getRangeAt(0).intersectsNode(opticalE)
          : false;
        opticalE.classList.toggle('is-selected', selected);
      };

      document.addEventListener('selectionchange', syncOpticalSelection);

      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

      const brand = document.querySelector('.brand');
      const leftLeaf = document.querySelector('.leaf--left');
      const rightLeaf = document.querySelector('.leaf--right');
      let target = 0;
      let current = 0;
      let frameId = 0;
      let releaseTimer = 0;
      let touchStartedAt = 0;
      const introTimers = [];

      const render = () => {
        current += (target - current) * .075;

        const shift = current * 1.6;
        const rotation = current * 2.4;
        leftLeaf.style.transform = `translate3d(${-shift}px, ${-shift}px, 0) rotate(${-rotation}deg)`;
        rightLeaf.style.transform = `translate3d(${shift}px, ${shift}px, 0) rotate(${rotation}deg)`;

        if (Math.abs(target - current) > .001) {
          frameId = requestAnimationFrame(render);
        } else {
          current = target;
          frameId = 0;
        }
      };

      const setTarget = (value) => {
        target = Math.min(1, Math.max(0, value));
        if (!frameId) frameId = requestAnimationFrame(render);
      };

      const cancelIntro = () => {
        while (introTimers.length) clearTimeout(introTimers.pop());
      };

      const proximity = (event) => {
        const rect = brand.getBoundingClientRect();
        const centerX = rect.left + rect.width / 2;
        const centerY = rect.top + rect.height / 2;
        const distance = Math.hypot(event.clientX - centerX, event.clientY - centerY);
        const radius = Math.min(320, Math.max(180, Math.min(innerWidth, innerHeight) * .42));
        return 1 - (distance - 24) / (radius - 24);
      };

      window.addEventListener('pointermove', (event) => {
        cancelIntro();
        if (event.pointerType === 'mouse') {
          setTarget(event.buttons ? 1 : proximity(event));
        }
      }, { passive:true });
      window.addEventListener('pointerdown', (event) => {
        cancelIntro();
        clearTimeout(releaseTimer);
        touchStartedAt = performance.now();
        setTarget(1);
      }, { passive:true });
      window.addEventListener('pointerup', (event) => {
        if (event.pointerType === 'mouse') {
          setTarget(proximity(event));
          return;
        }

        const remaining = Math.max(0, 520 - (performance.now() - touchStartedAt));
        releaseTimer = setTimeout(() => setTarget(0), remaining);
      }, { passive:true });
      window.addEventListener('pointercancel', () => setTarget(0), { passive:true });
      window.addEventListener('blur', () => setTarget(0));
      document.addEventListener('mouseleave', () => setTarget(0));

      introTimers.push(setTimeout(() => setTarget(.72), 560));
      introTimers.push(setTimeout(() => setTarget(0), 1480));
    })();
  </script>
</body>
</html>
